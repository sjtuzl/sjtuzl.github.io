# ---------------------------------------------------------------------------
# Ling Zhang's Blog — Jekyll configuration
# ---------------------------------------------------------------------------
title: "Ling Zhang's Blog"
description: "Ling Zhang's Blog — tech, work, and life notes (since 2004, migrated from WordPress)"
url: "https://sjtuzl.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Shanghai"

# ---------------------------------------------------------------------------
# 老内容开关：控制 2026 年以前的博客是否在首页和归档里显示。
#   show_legacy: false  → 隐藏（首页/归档都看不到老文，像下架一样）
#   show_legacy: true   → 全部显示（恢复原样）
# legacy_before 定义"老内容"的界线：发布年份 < 这个数字的算老文。
# 注意：这是纯前端列表过滤——被隐藏的老文单篇页面/RSS/站点地图仍存在（按需求忽略）。
# 改动后需重新构建/推送才生效。
show_legacy: false
legacy_before: 2026

author:
  name: "Ling Zhang"
  linkedin: "https://www.linkedin.com/in/zhangling"

# Posts keep the WordPress date-based URL shape: /YYYYMMDD/slug.html
# (each post also sets an explicit `permalink` in its front matter, which wins).
permalink: /:year:month:day/:title.html

# Home pagination (jekyll-paginate v1 — simple and reliable).
paginate: 10
paginate_path: "/page/:num/"

markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: false   # leave migrated raw HTML bodies untouched
  hard_wrap: false

# Home feed shows the full article body (everything before this marker); the
# archived comments live after it, so they appear on the post page only.
excerpt_separator: "<!--more-->"

# Front-matter defaults so a NEW post needs only `title` + `date`.
# (Existing migrated posts already declare these explicitly, so this
# changes nothing for them — it only saves boilerplate going forward.)
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: "post"
      has_comments: false

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

# Giscus (new comments). Turn on AFTER enabling repo Discussions + giscus.app.
giscus:
  enabled: true
  repo: "sjtuzl/sjtuzl.github.io"
  repo_id: "R_kgDOTSgb9w"
  category: "Announcements"
  category_id: "DIC_kwDOTSgb984DBEjD"

exclude:
  - migrate/
  - Gemfile
  - Gemfile.lock
  - README.md
  - POST_TEMPLATE.md
  - start.sh
  - xhs.sh
  - xhs.py
  - xhs-output/
  - vendor/
  - .bundle/
  - bin/
  - .github/
